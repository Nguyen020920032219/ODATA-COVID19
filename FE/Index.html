<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>COVID-19 Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }

        h1,
        h2 {
            color: #2c3e50;
        }

        #map,
        #treemap {
            height: 500px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: white;
        }

        #treemap {
            margin-top: 20px;
        }

        .controls {
            margin-bottom: 20px;
        }

        .controls button {
            font-size: 14px;
            padding: 10px 15px;
            margin-right: 5px;
            cursor: pointer;
            border: 1px solid #3498db;
            background-color: white;
            color: #3498db;
            border-radius: 5px;
            transition: all 0.2s;
        }

        .controls button.active {
            background-color: #3498db;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Bảng điều khiển COVID-19</h1>

    <div class="controls">
        <button id="btn-Confirmed" class="active" onclick="handleButtonClick('Confirmed')">Confirmed</button>
        <button id="btn-Active" onclick="handleButtonClick('Active')">Active</button>
        <button id="btn-Recovered" onclick="handleButtonClick('Recovered')">Recovered</button>
        <button id="btn-Deaths" onclick="handleButtonClick('Deaths')">Deaths</button>
    </div>

    <h2 id="map-title"># of Cases World wide</h2>
    <div id="map"></div>

    <h2 id="treemap-title" style="margin-top: 20px;">Treemap of Countries</h2>
    <div id="treemap"></div>

    <script>
        const ODATA_ENDPOINT = "https://localhost:7268/odata/CovidData";
        const LATEST_DATE = "2023-03-09";
        let currentCaseType = 'Confirmed';
        let map;
        let geoJsonLayer;

        function initializeDashboard() {
            map = L.map('map').setView([20, 20], 2.5);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            loadData(currentCaseType);
        }

        function handleButtonClick(caseType) {
            currentCaseType = caseType;
            document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${caseType}`).classList.add('active');
            loadData(caseType);
        }

        async function loadData(caseType) {
            console.log(`Đang tải dữ liệu cho: ${caseType}`);
            const title = `# of ${caseType} Cases World wide`;
            document.getElementById('map-title').innerText = title;
            document.getElementById('treemap-title').innerText = `Treemap of Countries - ${caseType}`;

            const url = `${ODATA_ENDPOINT}?$filter=RecordDate eq ${LATEST_DATE} and ${caseType} gt 0&$apply=groupby((CountryRegion, Latitude, Longitude), aggregate(${caseType} with sum as Total))&$orderby=Total desc`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`Network response was not ok: ${response.statusText}`);
                const data = await response.json();

                const processedData = data.value.map(item => ({
                    country: item.CountryRegion,
                    lat: item.Latitude,
                    lon: item.Longitude,
                    total: item.Total
                }));

                updateMap(processedData);
                updateTreemap(processedData);
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu:", error);
                alert("Không thể tải dữ liệu từ API. Hãy kiểm tra xem Backend đã chạy chưa và URL có đúng không.");
            }
        }

        function updateMap(data) {
            if (geoJsonLayer) {
                map.removeLayer(geoJsonLayer);
            }

            const markers = data
                .filter(d => d.lat !== null && d.lon !== null && d.total > 0)
                .map(d => {
                    const color = currentCaseType === 'Deaths' ? '#c0392b' : currentCaseType === 'Recovered' ? '#27ae60' : '#2980b9';
                    const radius = Math.log(d.total) * 20000;

                    const circle = L.circle([d.lat, d.lon], {
                        radius: Math.max(radius, 10000),
                        color: color,
                        fillColor: color,
                        fillOpacity: 0.6,
                        weight: 1
                    }).bindPopup(`<b>${d.country}</b><br>${currentCaseType}: ${d.total.toLocaleString()}`);
                    return circle;
                });

            geoJsonLayer = L.layerGroup(markers).addTo(map);
        }

        function updateTreemap(data) {
            d3.select("#treemap").selectAll("*").remove();

            const topData = data.slice(0, 50);

            const root = d3.hierarchy({ children: topData }).sum(d => d.total);
            const totalSum = root.value;

            const treemapLayout = d3.treemap()
                .size([document.getElementById('treemap').clientWidth, document.getElementById('treemap').clientHeight])
                .padding(2);

            treemapLayout(root);

            const svg = d3.select("#treemap").append("svg")
                .attr("width", "100%").attr("height", "100%");

            const nodes = svg.selectAll("g").data(root.leaves()).enter().append("g")
                .attr("transform", d => `translate(${d.x0},${d.y0})`);

            const colorScale = d3.scaleSequential(d3.interpolateViridis).domain([0, d3.max(topData, d => d.total)]);

            nodes.append("rect")
                .attr("width", d => d.x1 - d.x0)
                .attr("height", d => d.y1 - d.y0)
                .attr("fill", d => colorScale(d.data.total))
                .attr("stroke", "#333");

            nodes.append("text")
                .selectAll("tspan")
                .data(d => {
                    const percentage = ((d.data.total / totalSum) * 100).toFixed(1);
                    return (d.x1 - d.x0 > 60 && d.y1 - d.y0 > 30) ? [d.data.country, `${percentage}%`] : [];
                })
                .enter().append("tspan")
                .attr("x", 4).attr("y", (d, i) => 15 + i * 15)
                .text(d => d)
                .attr("font-size", "12px").attr("fill", "white");
        }

        document.addEventListener('DOMContentLoaded', initializeDashboard);
    </script>
</body>

</html>
